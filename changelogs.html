        (function () {
            var LABEL = { new: 'New', improved: 'Improved', fixed: 'Fixed' };
            var ORDER = ['new', 'improved', 'fixed'];
            var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            function esc(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }
            function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
            function fmt(d) {
                var p = d.split('-');
                return MONTHS[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0];
            }
            function slug(v) { return 'v' + v.replace(/\./g, '-'); }

            var list = document.getElementById('clList');
            var rail = document.getElementById('clRail');
            var counts = { all: 0, new: 0, improved: 0, fixed: 0 };
            var html = '', railHtml = '';

            CHANGELOG.forEach(function (e, i) {
                var groups = '';
                ORDER.forEach(function (k) {
                    var items = e.groups[k];
                    if (!items || !items.length) return;
                    counts[k] += items.length; counts.all += items.length;
                    groups += '<div class="cl-group" data-k="' + k + '">' +
                        '<span class="cl-tag cl-tag--' + k + '">' + LABEL[k] + '</span>' +
                        '<ul class="cl-items">' + items.map(function (t) { return '<li>' + rich(t) + '</li>'; }).join('') + '</ul></div>';
                });
                html += '<article class="cl-entry" id="' + slug(e.v) + '">' +
                    '<div class="cl-entry-head"><span class="cl-ver">v' + esc(e.v) + '</span>' +
                    '<time class="cl-date" datetime="' + esc(e.date) + '">' + fmt(e.date) + '</time></div>' +
                    '<h2>' + esc(e.title) + '</h2>' +
                    (e.summary ? '<p class="cl-summary">' + esc(e.summary) + '</p>' : '') +
                    '<div class="cl-card">' + groups + '</div></article>';
                railHtml += '<li><a href="#' + slug(e.v) + '" data-v="' + slug(e.v) + '"><span>v' + esc(e.v) +
                    (i === 0 ? '<span class="cl-new">New</span>' : '') + '</span><small>' + esc(e.date.slice(5).replace('-', '.')) + '</small></a></li>';
            });
            list.innerHTML = html;
            rail.innerHTML = railHtml;

            var latest = CHANGELOG[0];
            document.getElementById('clMeta').innerHTML =
                '<span>Latest <b>v' + esc(latest.v) + '</b></span>' +
                '<span>Updated <b>' + fmt(latest.date) + '</b></span>' +
                '<span><b>' + CHANGELOG.length + '</b> releases</span>';
            document.getElementById('clYear').textContent = new Date().getFullYear();

            document.querySelectorAll('.cl-filter').forEach(function (b) {
                var n = counts[b.dataset.f];
                if (n) b.insertAdjacentHTML('beforeend', '<span>' + n + '</span>');
            });

            /* filter by change type */
            var entries = [].slice.call(list.querySelectorAll('.cl-entry'));
            document.querySelector('.cl-filters').addEventListener('click', function (ev) {
                var btn = ev.target.closest('.cl-filter');
                if (!btn) return;
                var f = btn.dataset.f;
                document.querySelectorAll('.cl-filter').forEach(function (x) { x.setAttribute('aria-pressed', x === btn ? 'true' : 'false'); });
                var shown = 0;
                entries.forEach(function (en) {
                    var any = false;
                    en.querySelectorAll('.cl-group').forEach(function (g) {
                        var on = f === 'all' || g.dataset.k === f;
                        g.hidden = !on; if (on) any = true;
                    });
                    en.hidden = !any;
                    rail.querySelector('[data-v="' + en.id + '"]').parentNode.hidden = !any;
                    if (any) { shown++; en.classList.add('is-in'); }
                });
                document.getElementById('clEmpty').classList.toggle('show', !shown);
            });

            /* reveal + scroll-spy */
            var railLinks = [].slice.call(rail.querySelectorAll('a'));
            function setActive(id) {
                railLinks.forEach(function (a) {
                    var on = a.dataset.v === id;
                    a.classList.toggle('is-active', on);
                    if (on && window.matchMedia('(max-width: 860px)').matches) {
                        var ol = rail;
                        ol.scrollTo({ left: a.parentNode.offsetLeft - 18, behavior: 'smooth' });
                    }
                });
            }
            if ('IntersectionObserver' in window) {
                var rev = new IntersectionObserver(function (xs) {
                    xs.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('is-in'); rev.unobserve(x.target); } });
                }, { rootMargin: '0px 0px -8% 0px' });
                entries.forEach(function (en) { rev.observe(en); });
                var spy = new IntersectionObserver(function (xs) {
                    xs.forEach(function (x) { if (x.isIntersecting) setActive(x.target.id); });
                }, { rootMargin: '-35% 0px -60% 0px' });
                entries.forEach(function (en) { spy.observe(en); });
            } else {
                entries.forEach(function (en) { en.classList.add('is-in'); });
            }
            setActive(entries[0] && entries[0].id);

            /* header state */
            var nav = document.getElementById('navbar');
            function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 24); }
            window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
        })();
